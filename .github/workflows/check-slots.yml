name: Check InstaHelp Slots

on:
  schedule:
    # Run every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Check slot availability
        env:
          UC_SESSION: ${{ secrets.UC_SESSION }}
          UC_CITY: ${{ secrets.UC_CITY }}
        run: node scripts/check-slots.js
        continue-on-error: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: auth/screenshot*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Send notification
        if: always()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          NOTIFY_PHONE_NUMBER: ${{ secrets.NOTIFY_PHONE_NUMBER }}
        run: node scripts/notify.js
